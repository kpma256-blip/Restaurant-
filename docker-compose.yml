# Optional: a Postgres service for production use instead of the default
# SQLite dev database. To switch:
#   1. docker compose up -d
#   2. In backend/.env set DATABASE_URL="postgresql://inventory:inventory@localhost:5432/inventory"
#   3. In backend/prisma/schema.prisma change datasource `provider` to "postgresql"
#   4. cd backend && npx prisma migrate dev
# No application code changes are needed — every query goes through Prisma Client.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
