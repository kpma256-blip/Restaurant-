# Local Postgres for development, matching what the app uses in production
# (see README.md "Deploying it for real use"). Usage:
#   1. docker compose up -d
#   2. In backend/.env set DATABASE_URL="postgresql://inventory:inventory@localhost:5432/inventory"
#      (already the default in backend/.env.example)
#   3. cd backend && npx prisma migrate dev
# Don't have Docker? Any local or hosted Postgres works — just point
# DATABASE_URL at it instead.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
