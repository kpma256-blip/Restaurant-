# Render Blueprint — deploys this app as one web service + one managed
# Postgres database. In the Render dashboard: New -> Blueprint -> connect
# this GitHub repo -> Render reads this file and provisions everything
# below automatically. See README.md "Deploy to Render" for the full walkthrough.

databases:
  - name: restaurant-inventory-db
    plan: free
    databaseName: restaurant_inventory
    user: restaurant_inventory

services:
  - type: web
    name: restaurant-inventory
    runtime: node
    plan: free
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-inventory-db
          property: connectionString
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      # Toast credentials are entered later via the app's Toast Integration
      # page (Connect Toast), which stores them encrypted in the database —
      # they don't need to be set here. Only set these if you'd rather
      # configure Toast via environment variables instead.
      - key: TOAST_ENVIRONMENT
        value: sandbox
